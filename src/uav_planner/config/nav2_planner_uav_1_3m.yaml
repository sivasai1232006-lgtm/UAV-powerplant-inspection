/uav_1/planner_3m/planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      minimum_turning_radius: 0.4
      tolerance: 1.0
      downsample_costmap: true
      downsampling_factor: 2
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true

/uav_1/planner_3m/global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: uav_1/base_link
    update_frequency: 2.0
    publish_frequency: 1.0
    resolution: 0.25
    track_unknown_space: false
    rolling_window: false
    width: 240
    height: 640
    origin_x: -45.0
    origin_y: -80.0
    robot_radius: 0.5
    plugins: [static_layer, obstacle_layer, inflation_layer]
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /uav_1/planner_3m/map
      map_subscribe_transient_local: true
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      observation_sources: uav_1_scan
      uav_1_scan:
        topic: /planner_3m/uav_1/scan
        data_type: LaserScan
        marking: true
        clearing: true
        obstacle_max_range: 30.0
        raytrace_max_range: 30.0
        max_obstacle_height: 30.0
        observation_persistence: 0.5
        expected_update_rate: 0.0
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.65
      cost_scaling_factor: 4.0
